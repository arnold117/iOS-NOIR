<!DOCTYPE html>
<!--
  Source for assets/banner-en.png and assets/banner-zh.png (2500x1000). Regenerate:
  CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
  for L in en zh; do "$CHROME" --headless=new --hide-scrollbars --force-device-scale-factor=2 \
    --window-size=1250,500 --screenshot=assets/banner-$L.png "file://$PWD/assets/banner.html?lang=$L"; done
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1250px; height: 500px; overflow: hidden; }
  body {
    font-family: "Helvetica Neue", "PingFang SC", Helvetica, sans-serif;
    color: #e6ebf5;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(37, 56, 110, 0.35), transparent 60%),
      linear-gradient(100deg, #0e1729 0%, #0b1120 55%, #090c14 100%);
    position: relative;
  }
  .grid {
    position: absolute; inset: 12px 56px;
    background-image:
      linear-gradient(rgba(120, 150, 220, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 150, 220, 0.07) 1px, transparent 1px);
    background-size: 25px 25px;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 55%, transparent 100%);
  }
  .mono { font-family: "SF Mono", "JetBrains Mono", Menlo, "PingFang SC", monospace; }
  .left { position: absolute; left: 112px; top: 92px; width: 460px; }
  .badge {
    display: inline-block; padding: 6px 13px; border-radius: 999px;
    border: 1px solid rgba(96, 140, 255, 0.55); background: rgba(59, 91, 219, 0.14);
    color: #9dbcff; font-size: 11px; font-weight: 700; letter-spacing: 0.9px;
  }
  h1 {
    display: inline-block; margin-top: 14px; font-size: 80px; font-weight: 700; letter-spacing: -3.5px; line-height: 1;
    background: linear-gradient(90deg, #ffffff 0%, #e2e9ff 40%, #7aa2ff 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { margin-top: 14px; font-size: 18.5px; font-weight: 600; line-height: 1.45; color: #cdd6ea; }
  .chips { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px 9px; width: 465px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 11px;
    border-radius: 7px; font-size: 11.5px; font-weight: 700;
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .g { color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.45); background: rgba(74, 222, 128, 0.07); } .g i { background: #4ade80; }
  .o { color: #fb923c; border: 1px solid rgba(251, 146, 60, 0.45); background: rgba(251, 146, 60, 0.07); } .o i { background: #fb923c; }
  .p { color: #c084fc; border: 1px solid rgba(192, 132, 252, 0.45); background: rgba(192, 132, 252, 0.07); } .p i { background: #c084fc; }
  .foot { margin-top: 20px; font-size: 12.5px; color: #8a94a8; line-height: 1.15; width: 470px; }
  .cards {
    position: absolute; left: 616px; top: 86px;
    display: grid; grid-template-columns: repeat(3, 164px); grid-auto-rows: 156px; gap: 15px;
  }
  .card {
    border-radius: 14px; padding: 16px 16px 0; background: #14161d;
    border: 1px solid rgba(255, 255, 255, 0.09);
  }
  .num { font-size: 37px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
  .t { margin-top: 9px; font-size: 13.5px; font-weight: 700; line-height: 1.35; color: #ffffff; }
  .d { margin-top: 7px; font-size: 10.5px; line-height: 1.35; color: #9aa3b5; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="left">
  <div class="badge" data-k="badge"></div>
  <h1>iOS-NOIR</h1>
  <div class="sub" data-k="sub"></div>
  <div class="chips">
    <span class="chip g"><i></i><span data-k="c1"></span></span>
    <span class="chip o"><i></i><span data-k="c2"></span></span>
    <span class="chip p"><i></i><span data-k="c3"></span></span>
  </div>
  <div class="foot mono">github.com/arnold117/iOS-NOIR · Inspired by Verlintas/NOIR &amp; RootSir</div>
</div>
<div class="cards" id="cards"></div>
<script>
// Numbers come from the author's iPhone scan (2026-11-06). Card 4 = Layer 4 (hardcoded carrier phone-number gateways).
const COLORS = ["#60a5fa", "#f87171", "#fb923c", "#a78bfa", "#facc15", "#4ade80"];
const T = {
  en: {
    badge: "🛡️ OPEN-SOURCE STOCK iOS FORENSIC AUDITOR · NO JAILBREAK",
    sub: "Auditing 148 Apps on a Non-Jailbroken iPhone: Silent VoIP Exemptions, Kernel Wi-Fi Hooks &amp; The 5-Layer Identity Chain",
    c1: "[VERIFIED] Static/Sandbox Proof", c2: "[CAPABILITY] Kernel Entitlement", c3: "[INFERRED] Cross-App DNA",
    cards: [
      ["148", "Audited Stock iOS Apps", "Full Apple-signed Entitlements &amp; Info.plist"],
      ["7", "Silent VoIP Exemptions", "unrestricted-voip-regulatory (No CallKit UI)"],
      ["5", "Kernel Wi-Fi Scan Hooks", "HotspotHelper BSSID harvesting without GPS"],
      ["3", "Carrier SIM Auth Gateways", "cmpassport, wostore,<br>id6.me hardcoded in ATS"],
      ["280+", "URL Scheme App Probes", "Probing VPNs, crypto, banks &amp; 15+ supercars"],
      ["12", "FaceID-Free USB/Wi-Fi Dumps", "Unauthenticated /Documents via HouseArrest"],
    ],
  },
  zh: {
    badge: "🛡️ 免越狱 iOS 底层隐私与遥测取证工具 · 100% 本地开源",
    sub: "穿透未越狱 iPhone 的 148 款应用：揭秘监管特批无声唤醒、系统级 Wi-Fi 钩子与五层防卸载设备身份链",
    c1: "【实锤】静态/沙盒铁证", c2: "【机制实锤】苹果签名内核特权", c3: "【推断】跨容器指纹关联",
    cards: [
      ["148", "已审计未越狱应用", "全量穿透 Apple 签名特权树与静态配置"],
      ["7", "监管特批无声 VoIP 唤醒", "unrestricted-voip-regulatory 免死金牌"],
      ["5", "系统级 Wi-Fi 扫描钩子", "HotspotHelper 关掉 GPS 照样定位楼层"],
      ["3", "写死运营商取号网关", "cmpassport / wostore<br>id6.me 一键取号"],
      ["280+", "单 App 查户口嗅探暗号", "暗中嗅探小火箭、境外银行与 15+ 家豪车"],
      ["12", "免 FaceID 裸露沙盒目录", "USB/局域网 1 秒直读 .kdbx 与账单数据库"],
    ],
  },
};
const lang = new URLSearchParams(location.search).get("lang") === "zh" ? "zh" : "en";
const t = T[lang];
document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
document.querySelectorAll("[data-k]").forEach(el => (el.innerHTML = t[el.dataset.k]));
document.getElementById("cards").innerHTML = t.cards.map(([n, title, desc], i) =>
  `<div class="card"><div class="num mono" style="color:${COLORS[i]}">${n}</div><div class="t">${title}</div><div class="d mono">${desc}</div></div>`
).join("");
</script>
</body>
</html>
